[workspace]
resolver = "3"
members = ["crates/axon-core", "crates/axon-ledger", "crates/axon-wasm", "src-tauri"]

# 어댑터/엔진:
#   "crates/axon-core"   — 순수 결정론 코어 (wasm-ready, 폴라스 절대 금지)
#   "crates/axon-ledger" — 원장/감사 분석 엔진 (폴라스, 데스크톱 전용)
#   "src-tauri"          — Tauri 데스크톱 어댑터
#   "crates/axon-wasm"   — WASM 웹 어댑터 (나중, maybe엔 안 판다)

[workspace.package]
edition = "2024"
license = "AGPL-3.0"
rust-version = "1.85"   # MSRV = edition 2024 floor. 현재 깔린 버전(1.95)이 아니라 실제 요구 기능 기준.

# 워크스페이스 lint 정책 — 각 crate 가 [lints] workspace = true 로 상속한다.
[workspace.lints.rust]
unsafe_code = "deny"   # 결정론 코어엔 unsafe 불필요. 필요한 어댑터(wasm 등)만 crate 단위로 풀어라.

[workspace.lints.clippy]
# 회계 도구 = 패닉/정밀도 민감. 점진 강화 — 지금은 흔적·미완성 코드만 막는다.
todo = "warn"
dbg_macro = "warn"
