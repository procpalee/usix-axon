<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>axon</title>
  </head>
  <body data-theme="dark">
    <div id="app">
      <nav class="activitybar">
        <button id="workpaper-open" class="act-item" title="조서 자동화 (유료)" hidden>📋</button>
        <button class="act-item active" data-view="ledger" title="전표·원장 분석">🧮</button>
        <button class="act-item" data-view="dart" title="DART 분석">📊</button>
        <button id="panel-toggle" class="act-item" title="작업 패널 (채팅·조서·분석)">💬</button>
        <button class="act-item" data-view="settings" title="설정">⚙️</button>
      </nav>

      <aside class="sidebar">
        <div class="view hidden" data-view="dart">
          <div class="sidebar-header" data-i18n="dart">DART 분석</div>
          <div class="sidebar-section">
            <h3 data-i18n="fsSection">재무제표 조회</h3>
            <button id="corp-search-open">🔍 회사 검색</button>
            <input id="corp-code" data-i18n-ph="corpPh" placeholder="corp_code (8자리)" />
            <span id="corp-name" class="status-line"></span>
            <input id="year-start" placeholder="시작연도 (예: 2014)" />
            <input id="year-end" placeholder="종료연도 (예: 2023)" />
            <select id="dart-basis" title="연결/별도 재무제표">
              <option value="CFS">연결재무제표</option>
              <option value="OFS">별도재무제표</option>
            </select>
            <select id="dart-reprt" title="보고서 종류">
              <option value="11011">사업보고서 (연간)</option>
              <option value="11014">3분기</option>
              <option value="11012">반기</option>
              <option value="11013">1분기</option>
            </select>
            <button id="fetch" data-i18n="fetch">조회</button>
          </div>
        </div>
        <div class="view" data-view="ledger">
          <div class="sidebar-header">
            데이터셋
            <button id="ledger-open" class="sidebar-hdr-btn" title="CSV·Excel 열기">+</button>
          </div>
          <div id="dataset-tree" class="dataset-tree"></div>
        </div>
        <div class="view hidden" data-view="chat">
          <div class="sidebar-header">daemon 채팅</div>
          <div class="sidebar-section">
            <p class="status-line">설정 ⚙️ 에서 daemon 주소·토큰을 먼저 설정하세요.</p>
          </div>
        </div>
      </aside>

      <main class="main">
        <div class="view hidden" data-view="dart">
          <div id="result-area">
            <p class="placeholder" data-i18n="resultPlaceholder">왼쪽에서 조회하면 결과가 여기 표시됩니다.</p>
          </div>
        </div>
        <div class="view ledger-layout" data-view="ledger">
          <div class="ledger-toolbar">
            <button id="tb-open" title="파일 열기">📂 열기</button>
            <span class="tb-sep"></span>
            <button id="tb-dup" title="중복 검출">중복</button>
            <button id="tb-gap" title="갭 검출">갭</button>
            <button id="tb-benford" title="벤포드">벤포드</button>
            <span class="tb-sep"></span>
            <button id="tb-mus" title="화폐단위표본추출">MUS</button>
            <button id="tb-counter" title="상대전표 추출">상대전표</button>
            <span class="tb-sep"></span>
            <select id="tb-export" class="tb-select" title="내보내기">
              <option value="">내보내기…</option>
              <option value="pdf">PDF</option>
              <option value="xlsx">Excel</option>
              <option value="csv">CSV</option>
            </select>
          </div>
          <div id="ledger-tabs" class="ledger-tabs"></div>
          <div id="ledger-grid" class="ledger-grid">
            <p class="placeholder">CSV·Excel 파일을 열어 원장 분석을 시작하세요.</p>
          </div>
        </div>
        <div class="view hidden settings-view" data-view="settings">
          <div class="settings-card">
            <h2>설정</h2>
            <section>
              <h3 data-i18n="keySection">OpenDART 키</h3>
              <p id="key-status" class="status-line" data-i18n="keyChecking">확인 중...</p>
              <div class="field-row">
                <input id="key-input" type="password" data-i18n-ph="keyPh" placeholder="인증키" />
                <button id="key-save" data-i18n="save">저장</button>
                <button id="key-delete" data-i18n="delete">삭제</button>
              </div>
            </section>
            <section>
              <h3>daemon 서버</h3>
              <div class="field-row">
                <input id="daemon-url" placeholder="https://daemon 주소" />
                <button id="daemon-url-save">주소 저장</button>
              </div>
              <div class="field-row">
                <button id="daemon-login">🔐 로그인</button>
                <button id="daemon-logout">로그아웃</button>
                <button id="daemon-ping">연결 테스트</button>
                <span class="spacer"></span>
                <button id="daemon-clear">초기화</button>
                <button id="token-claims">claim 🔍</button>
              </div>
              <p id="daemon-status" class="status-line"></p>
            </section>
            <section>
              <h3>셸 실행 (C)</h3>
              <label class="check-row"><input type="checkbox" id="shell-toggle" /> 셸 명령 허용 ⚠️</label>
            </section>
          </div>
        </div>
      </main>

      <section id="work-panel" class="panel">
        <div id="panel-resize" class="panel-resize" title="드래그로 너비 조절"></div>
        <div class="panel-header">
          <div class="panel-tabs">
            <button class="panel-tab active" data-tab="chat">채팅</button>
            <button class="panel-tab" data-tab="report" disabled title="준비 중">조서</button>
            <button class="panel-tab" data-tab="analysis" disabled title="준비 중">분석</button>
          </div>
          <span class="spacer"></span>
          <button id="chat-reset" class="panel-btn" title="대화 초기화 — 새 세션 시작">🗑 초기화</button>
          <button id="panel-collapse" class="panel-btn" title="패널 닫기">✕</button>
        </div>
        <div class="panel-body">
          <div class="chat-view" data-tab="chat">
            <div id="chat-log" class="chat-log" role="log" aria-live="polite" aria-relevant="additions"></div>
            <div class="chat-input">
              <button id="chat-jump" class="chat-jump" type="button" aria-label="맨 아래로" hidden>▼</button>
              <textarea id="chat-text" placeholder="메시지 입력 (Enter 전송 · Shift+Enter 줄바꿈)" rows="2"></textarea>
              <div class="chat-actions">
                <button id="chat-send">전송</button>
                <button id="chat-stop">중지</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <footer class="statusbar">
        <span id="status-key">🔑 —</span>
        <span id="status-plan" class="sb-plan"></span>
        <span class="spacer"></span>
        <select id="lang-select" class="sb-select">
          <option value="ko">한국어</option>
          <option value="en">English</option>
        </select>
        <button id="theme-toggle" class="sb-btn">🌙</button>
      </footer>
    </div>

    <div id="modal" class="modal hidden">
      <div class="modal-box">
        <h2 id="modal-title"></h2>
        <p id="modal-body"></p>
        <div class="modal-actions">
          <button id="modal-ok"></button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
